<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAT Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: header → sticky filters → overview KPIs → one donut per section (click to filter) → monthly trend → data table */
:root{--bg:#f3f6f7;--card:#fff;--fg:#13232a;--mut:#5b6e77;--line:#dbe3e7;--acc:#0e7490;--accbg:#e3f2f6;--track:#e7edf0;
--ok:#15803d;--okbg:#e5f4ea;--warn:#b45309;--warnbg:#fdf1dc;--bad:#c2410c;--badbg:#fde9df;
--f-body:"IBM Plex Sans Thai",system-ui,sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161b;--card:#15232a;--fg:#e5eef2;--mut:#93a7b1;--line:#26373e;--acc:#38bdd8;--accbg:#163640;--track:#22333a;--ok:#4ade80;--okbg:#14301e;--warn:#fbbf24;--warnbg:#3a2c10;--bad:#fb923c;--badbg:#3b2216;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d161b;--card:#15232a;--fg:#e5eef2;--mut:#93a7b1;--line:#26373e;--acc:#38bdd8;--accbg:#163640;--track:#22333a;--ok:#4ade80;--okbg:#14301e;--warn:#fbbf24;--warnbg:#3a2c10;--bad:#fb923c;--badbg:#3b2216;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{padding-top:22px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
h1{font-size:24px;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--mut);font-size:13px}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fl{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:140px}
button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{display:flex;flex-direction:column;gap:12px}
h2{font-size:17px;margin:0;font-weight:600}
.hint{color:var(--mut);font-size:13px;margin:-8px 0 0}
.summary{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:15px}
.summary b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:640px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .big{font:600 32px/1.15 var(--f-num);font-variant-numeric:tabular-nums;color:var(--st,var(--fg))}
.kpi .lb{font-size:13px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--st);margin-right:5px;vertical-align:-1px}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.sc{text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--st);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;align-items:stretch;gap:10px;cursor:pointer;color:var(--fg)}
.sc.sel{box-shadow:0 0 0 2px var(--acc)}
.sc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc .nm{font-weight:600;font-size:15px}
.pill{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--stbg);color:var(--st);white-space:nowrap;font-weight:500}
.donut{position:relative;width:150px;height:150px;margin:0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .pct{font:600 26px/1 var(--f-num);color:var(--st);font-variant-numeric:tabular-nums}
.donut .cl{font-size:12px;color:var(--mut);margin-top:4px}
.kv{display:flex;flex-direction:column;gap:3px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:8px}
.kv b{font:500 13px var(--f-num);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.kv .tg{color:var(--mut)}
.s-ok{--st:var(--ok);--stbg:var(--okbg)}.s-warn{--st:var(--warn);--stbg:var(--warnbg)}.s-bad{--st:var(--bad);--stbg:var(--badbg)}.s-na{--st:var(--mut);--stbg:var(--track)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.cols{display:flex;align-items:flex-end;gap:6px;height:210px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col .bar{width:100%;max-width:52px;border-radius:4px 4px 0 0;background:var(--st);min-height:2px}
.col .val{font:500 12px var(--f-num);color:var(--st)}
.col .t{font-size:12px;color:var(--mut);white-space:nowrap}
.col .c{font-size:11px;color:var(--mut)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;background:var(--stbg);color:var(--st);white-space:nowrap}
.empty{color:var(--mut);padding:10px 0}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div><h1>Turnaround Time (TAT)</h1><div class="sub" id="range"></div></div>
  <button id="theme" type="button">สลับโหมดมืด/สว่าง</button>
</header>

<div class="filters">
  <label class="fl">เดือน<select id="fMonth"></select></label>
  <label class="fl">เซกชั่น<select id="fSec"></select></label>
  <button type="button" id="reset">ล้างตัวกรอง</button>
</div>

<section id="overview">
  <h2>ภาพรวม</h2>
  <div class="summary" id="summary"></div>
  <div class="kpis" id="kpis"></div>
</section>

<section id="sections">
  <h2>TAT รายเซกชั่น</h2>
  <p class="hint">วงกลม = 100% ของงานในเซกชั่นนั้น · เขียว = ออกผลทันเวลา · ส้ม = เกินเวลา · กดที่การ์ดเพื่อดูเฉพาะเซกชั่นนั้น</p>
  <div class="legend"><span class="s-ok">ผ่านเป้า</span><span class="s-warn">ต่ำกว่าเป้าไม่เกิน 5%</span><span class="s-bad">ต่ำกว่าเป้าเกิน 5%</span></div>
  <div class="secs" id="secCards"></div>
</section>

<section id="trend">
  <h2>% ทันเวลารายเดือน</h2>
  <p class="hint" id="trendHint"></p>
  <div class="card"><div class="cols" id="cMonth"></div></div>
</section>

<section id="table">
  <h2>ข้อมูล</h2>
  <div class="card"><div class="tw"><table><thead><tr><th>เดือน</th><th>เซกชั่น</th><th class="r">ทันเวลา</th><th class="r">เกินเวลา</th><th class="r">รวม</th><th class="r">% ทันเวลา</th><th class="r">เป้า</th><th>หมายเหตุ</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</section>

<p class="sub" id="foot"></p>
</div>

<script>
/* อ่านข้อมูลจาก Google Sheet โดยตรง (ชีตต้องแชร์แบบ "ทุกคนที่มีลิงก์ดูได้") */
const SHEET_ID="1G9R75nOAh_QtLGnQeRtAhp52kl-QQxn-nqawZJpZgRA", GID=0, RANGE="A1:F500";
function loadSheet(){
  return new Promise((resolve,reject)=>{
    const cb="tatCb"+Date.now(); const s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();reject(new Error("timeout"))},20000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=r=>{cleanup();if(r.status==="error")reject(new Error((r.errors||[]).map(e=>e.detailed_message||e.message).join("; ")));else resolve(r)};
    s.onerror=()=>{cleanup();reject(new Error("network"))};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&gid=${GID}&headers=1&range=${RANGE}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
function toRows(r){
  const cols=r.table.cols.map(c=>String(c.label||"").trim());
  const ix=name=>cols.findIndex(c=>c.toLowerCase().startsWith(name));
  const I={m:ix("month"),s:ix("section"),w:ix("within"),o:ix("over"),t:ix("target"),n:ix("note")};
  const cell=(row,i)=>i<0||!row.c[i]?null:row.c[i];
  const num=c=>{if(!c)return null;if(typeof c.v==="number")return c.v;const n=Number(String(c.v??c.f??"").replace(/[,%\s]/g,""));return String(c.v??"").trim()===""||isNaN(n)?null:n};
  const month=c=>{if(!c)return"";const v=c.v;if(typeof v==="string"&&/^Date\(/.test(v)){const p=v.match(/\d+/g);return p[0]+"-"+String(+p[1]+1).padStart(2,"0")}
    const s=String(c.f??v??"").trim();let m=s.match(/^(\d{4})-(\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0");m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+"-"+m[2].padStart(2,"0");return s};
  return r.table.rows.map(row=>({m:month(cell(row,I.m)),s:String((cell(row,I.s)||{}).v??"").trim(),w:num(cell(row,I.w)),o:num(cell(row,I.o)),t:num(cell(row,I.t)),n:String((cell(row,I.n)||{}).v??"")}))
    .filter(r=>r.m&&r.s&&(r.w!=null||r.o!=null)).map(r=>({...r,w:r.w||0,o:r.o||0}));
}
const fmtTime=d=>d.toLocaleString("th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
loadSheet().then(r=>boot(toRows(r),fmtTime(new Date()))).catch(e=>{
  document.querySelector(".wrap").insertAdjacentHTML("afterbegin",'<div class="summary" style="border-color:var(--bad);color:var(--bad)">โหลดข้อมูลจาก Google Sheet ไม่สำเร็จ — ตรวจว่าชีตแชร์แบบ "ทุกคนที่มีลิงก์ดูได้" แล้ว</div>');
  console.error(e);
});
setTimeout(()=>location.reload(),10*60*1000); // รีเฟรชทุก 10 นาที
function boot(rows,updated){
const DATA={updated};
const ORDER=["Hematology","Chemistry","Microscopic","Immunology","Blood Bank"];
const SECS=[...ORDER,...[...new Set(rows.map(r=>r.s))].filter(s=>!ORDER.includes(s))];
const DEF_TARGET=90;
const MN=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mlabel=m=>MN[+m.slice(5,7)-1]+" "+(+m.slice(0,4)+543-2500);
const months=[...new Set(rows.map(r=>r.m))].sort();
const latest=months[months.length-1]||"";
const fmt=n=>Number.isInteger(n)?n.toLocaleString("en-US"):n.toLocaleString("en-US",{maximumFractionDigits:1});

$("fMonth").innerHTML='<option value="">ทุกเดือน</option>'+months.map(m=>`<option value="${m}">${mlabel(m)}</option>`).join("");
$("fMonth").value=latest;
$("fSec").innerHTML='<option value="">ทุกเซกชั่น</option>'+SECS.map(s=>`<option>${esc(s)}</option>`).join("");
$("range").textContent=months.length?`ข้อมูล ${mlabel(months[0])} – ${mlabel(latest)} · ${rows.length} แถว`:"ยังไม่มีข้อมูลในชีต";
$("foot").textContent=`ที่มา: Google Sheet · อัปเดตล่าสุด ${DATA&&DATA.updated?DATA.updated:"-"} · เป้าหมายใช้ค่าในคอลัมน์ Target % (ถ้าว่างใช้ ${DEF_TARGET}%)`;

// aggregate rows → {w,o,n,p,t}
function agg(list){
  const w=list.reduce((a,r)=>a+r.w,0),o=list.reduce((a,r)=>a+r.o,0),n=w+o;
  const ts=list.map(r=>r.t).filter(t=>t!=null&&!isNaN(t));
  const t=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:DEF_TARGET;
  return {w,o,n,p:n?w/n*100:null,t};
}
const cls=(p,t)=>p==null?"s-na":p>=t?"s-ok":p>=t-5?"s-warn":"s-bad";
const lbl=(p,t)=>p==null?"ไม่มีข้อมูล":p>=t?"ผ่านเป้า":"ต่ำกว่าเป้า";

function donut(a){
  const R=42,C=2*Math.PI*R;
  if(!a.n)return `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"/>`;
  const wl=a.w/a.n*C, gap=a.w&&a.o?1.2:0;
  return `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"/>
  <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--ok)" stroke-width="14" stroke-dasharray="${Math.max(0,wl-gap)} ${C}"/>
  ${a.o?`<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--bad)" stroke-width="14" stroke-dasharray="${Math.max(0,C-wl-gap)} ${C}" stroke-dashoffset="${-wl}"/>`:""}`;
}

function render(){
  const fm=$("fMonth").value, fs=$("fSec").value;
  const inM=rows.filter(r=>!fm||r.m===fm);
  const sel=inM.filter(r=>!fs||r.s===fs);
  const A=agg(sel);
  const per=SECS.map(s=>({s,a:agg(inM.filter(r=>r.s===s))}));
  const below=per.filter(x=>x.a.p!=null&&x.a.p<x.a.t);
  const has=per.filter(x=>x.a.p!=null);

  const when=fm?`เดือน <b>${mlabel(fm)}</b>`:"<b>ทุกเดือนรวมกัน</b>";
  $("summary").innerHTML=!A.n?`${when}: ยังไม่มีข้อมูล`:
    `${when}${fs?` · ${esc(fs)}`:""}: ออกผลทันเวลา <b>${A.p.toFixed(1)}%</b> จาก ${fmt(A.n)} รายการ`+
    (fs?"":` · ผ่านเป้า ${has.length-below.length}/${has.length} เซกชั่น`+(below.length?` · ต่ำกว่าเป้า: <b>${below.map(x=>esc(x.s)).join(", ")}</b>`:""));

  $("kpis").innerHTML=`
    <div class="kpi ${cls(A.p,A.t)}"><div class="big">${A.p==null?"–":A.p.toFixed(1)+"%"}</div><div class="lb">ทันเวลา (เป้า ${fmt(A.t)}%)</div></div>
    <div class="kpi"><div class="big">${fmt(A.n)}</div><div class="lb">รายการทั้งหมด</div></div>
    <div class="kpi ${A.o?"s-bad":""}"><div class="big">${fmt(A.o)}</div><div class="lb">รายการเกินเวลา</div></div>`;

  $("secCards").innerHTML=per.map(({s,a})=>{
    const c=cls(a.p,a.t);
    return `<button type="button" class="sc ${c} ${fs===s?"sel":""}" data-s="${esc(s)}" aria-pressed="${fs===s}">
      <div class="top"><span class="nm">${esc(s)}</span><span class="pill">${lbl(a.p,a.t)}</span></div>
      <div class="donut" role="img" aria-label="${esc(s)} ทันเวลา ${a.p==null?"-":a.p.toFixed(1)}%"><svg viewBox="0 0 100 100">${donut(a)}</svg>
        <div class="ctr"><span class="pct">${a.p==null?"–":a.p.toFixed(1)+"%"}</span><span class="cl">ทันเวลา</span></div></div>
      <div class="kv">
        <div><span><i class="dot" style="background:var(--ok)"></i>ทันเวลา</span><b>${fmt(a.w)} (${a.n?(a.w/a.n*100).toFixed(1):"0"}%)</b></div>
        <div><span><i class="dot" style="background:var(--bad)"></i>เกินเวลา</span><b>${fmt(a.o)} (${a.n?(a.o/a.n*100).toFixed(1):"0"}%)</b></div>
        <div class="tg"><span>เป้าหมาย</span><b>≥ ${fmt(a.t)}%</b></div>
      </div></button>`}).join("");
  $("secCards").querySelectorAll(".sc").forEach(b=>b.onclick=()=>{$("fSec").value=($("fSec").value===b.dataset.s?"":b.dataset.s);render()});

  // trend ignores month filter so all months stay visible
  $("trendHint").textContent=(fs||"ทุกเซกชั่นรวมกัน")+" · ความสูงแท่งเริ่มที่ 50% · ตัวเลขล่าง = เกินเวลา/ทั้งหมด"+(fm?" · เดือนที่เลือกเน้นไว้":"");
  $("cMonth").innerHTML=months.length?months.map(m=>{
    const a=agg(rows.filter(r=>r.m===m&&(!fs||r.s===fs)));
    const h=a.p==null?0:Math.max(4,(a.p-50)/50*150);
    return `<div class="col ${cls(a.p,a.t)}" style="${fm&&fm!==m?"opacity:.4":""}" title="${mlabel(m)}: ทันเวลา ${a.p==null?"-":a.p.toFixed(1)+"%"} (เกินเวลา ${a.o}/${a.n})">
      <div class="val">${a.p==null?"–":a.p.toFixed(0)+"%"}</div><div class="bar" style="height:${h}px"></div><div class="t">${mlabel(m)}</div><div class="c">${fmt(a.o)}/${fmt(a.n)}</div></div>`}).join(""):'<div class="empty">ยังไม่มีข้อมูล</div>';

  const list=[...sel].sort((a,b)=>b.m.localeCompare(a.m)||SECS.indexOf(a.s)-SECS.indexOf(b.s));
  $("tbody").innerHTML=list.map(r=>{const a=agg([r]);return `<tr><td>${mlabel(r.m)}</td><td>${esc(r.s)}</td><td class="r">${fmt(r.w)}</td><td class="r">${fmt(r.o)}</td><td class="r">${fmt(a.n)}</td><td class="r"><span class="chip ${cls(a.p,a.t)}">${a.p==null?"–":a.p.toFixed(1)+"%"}</span></td><td class="r">${fmt(a.t)}%</td><td>${esc(r.n||"")}</td></tr>`}).join("")||'<tr><td colspan="8" class="empty">ไม่มีข้อมูล</td></tr>';
}
$("fMonth").onchange=$("fSec").onchange=render;
$("reset").onclick=()=>{$("fMonth").value=latest;$("fSec").value="";render()};
$("theme").onclick=()=>{const d=document.documentElement,a=d.getAttribute("data-theme"),dark=a==="dark"||(!a&&matchMedia("(prefers-color-scheme: dark)").matches);d.setAttribute("data-theme",dark?"light":"dark")};
render();
}
</script>

</body>
</html>
